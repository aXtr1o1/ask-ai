<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advance Ask AI Playground</title>
  <!-- Google Fonts: Outfit and Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Variables for light & dark themes */
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-heading: 'Outfit', sans-serif;
      --font-mono: 'Fira Code', monospace;
      
      /* Dark Theme (Default) */
      --bg-app: #0b0f19;
      --bg-sidebar: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.45);
      --bg-card-hover: rgba(30, 41, 59, 0.65);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-subtle: rgba(255, 255, 255, 0.04);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: rgba(255, 255, 255, 0.45);
      --accent-gold-primary: #D4AF37;
      --accent-gold-secondary: #AA7C11;
      --accent-gold-light: #ffd700;
      --accent-gold-bg: rgba(212, 175, 55, 0.15);
      --shadow-premium: 0 10px 30px -10px rgba(0, 0, 0, 0.5), 0 1px 1px rgba(255, 255, 255, 0.05);
      --bg-code: rgba(15, 23, 42, 0.7);
      
      /* UI states */
      --sidebar-width: 280px;
    }

    [data-theme="light"] {
      --bg-app: #f8fafc;
      --bg-sidebar: #ffffff;
      --bg-card: rgba(241, 245, 249, 0.7);
      --bg-card-hover: rgba(241, 245, 249, 0.9);
      --border-color: rgba(15, 23, 42, 0.08);
      --border-color-subtle: rgba(15, 23, 42, 0.04);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: rgba(15, 23, 42, 0.5);
      --accent-gold-primary: #aa7c11;
      --accent-gold-secondary: #8a6508;
      --accent-gold-light: #8a6508;
      --accent-gold-bg: rgba(212, 175, 55, 0.1);
      --shadow-premium: 0 10px 30px -10px rgba(15, 23, 42, 0.08), 0 1px 1px rgba(15, 23, 42, 0.02);
      --bg-code: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100vh;
      overflow: hidden;
      display: flex;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.25);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.45);
    }

    /* Main Area Styles */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    .header-bar {
      height: 64px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 5;
    }

    .engine-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content-wrapper {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
    }

    /* Welcome / Landing Styles */
    .landing-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: var(--shadow-premium);
      animation: fadeIn 0.6s ease-out;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes goldShine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .landing-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      margin-top: 4px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .quick-start-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 600px;
      margin-top: 32px;
    }

    .quick-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quick-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-gold-primary);
      transform: translateY(-2px);
    }

    .quick-card-title {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quick-card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Chat Elements */
    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    .message-user {
      align-self: flex-end;
      max-width: 80%;
      background: linear-gradient(135deg, var(--accent-gold-primary) 0%, var(--accent-gold-secondary) 100%);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 18px 18px 4px 18px;
      font-size: 14.5px;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
      animation: messageSlideIn 0.3s ease-out;
    }

    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-ai {
      align-self: flex-start;
      width: 100%;
      animation: messageSlideIn 0.4s ease-out;
    }

    /* Input Bar Area */
    .input-container {
      border-top: 1px solid var(--border-color);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg-app);
      transition: background-color 0.3s;
    }

    .input-box-wrapper {
      width: 100%;
      max-width: 800px;
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-box-wrapper:focus-within {
      border-color: var(--accent-gold-primary);
      box-shadow: 0 0 0 2px var(--accent-gold-bg);
    }

    .textarea-mock {
      width: 100%;
      min-height: 48px;
      max-height: 160px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      padding: 14px 16px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
    }

    .input-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 8px 12px;
      border-top: 1px solid var(--border-color-subtle);
    }



    .send-btn {
      background: linear-gradient(135deg, var(--accent-gold-primary) 0%, var(--accent-gold-secondary) 100%);
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
      transition: transform 0.2s, opacity 0.2s;
    }

    .send-btn:hover {
      transform: scale(1.05);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    /* Streaming Cursor */
    .stream-cursor {
      display: inline-block;
      width: 2px;
      height: 15px;
      background-color: var(--accent-gold-light);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Tabler-like SVGs */
    .btn-svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-svg-lg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* GRAPH Layout styling */ 
    .graph-container {
      background: var(--bg-code);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      width: 100%;
      height: 320px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .graph-svg {
      width: 100%;
      height: 100%;
    }

    .node {
      cursor: pointer;
      transition: transform 0.2s;
    }

    .node:hover {
      transform: scale(1.1);
    }

    .node circle {
      stroke-width: 2px;
    }

    .node text {
      font-size: 11px;
      font-weight: 500;
      font-family: var(--font-sans);
    }

    .link {
      stroke-width: 1.5px;
      stroke-dasharray: 4 2;
      animation: dash 10s linear infinite;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
        /* Thinking Step Fade-In Animation */
    @keyframes stepFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .thinking-step-item {
      animation: stepFadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .thinking-agent-block {
      padding: 12px 14px;
      background: rgba(212, 175, 55, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.12);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thinking-agent-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #D4AF37;
      font-weight: 600;
      font-family: var(--font-heading);
      font-size: 13px;
    }

    .thinking-agent-summary {
      color: var(--text-secondary);
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 13px;
    }

    .thinking-detail-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 2px;
    }

    .thinking-detail-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding-left: 4px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.45;
    }

    .thinking-detail-label {
      color: #f5d36b;
      font-weight: 600;
      flex: 0 0 auto;
    }

    .thinking-detail-value {
      flex: 1 1 auto;
      word-break: break-word;
    }
  </style>
</head>
<body>


  <!-- Main Content Container -->
  <main class="main-container">
    <header class="header-bar">
      <div class="engine-status">
        <span class="status-dot"></span>
        <span>NanoSoft Advance Ask-AI </span>
      </div>

    </header>

    <div class="content-area">
      <div class="content-wrapper" id="content-wrapper">
        <!-- Dynmically loaded content will appear here -->
      </div>
    </div>

    <!-- Input Bar -->
    <div class="input-container">
      <div class="input-box-wrapper">
        <textarea 
          class="textarea-mock" 
          id="query-input" 
          placeholder="Ask a question..."
          onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendQuery(); }"
        ></textarea>
        <div class="input-controls">
          <button class="send-btn" onclick="sendQuery()" title="Send prompt to engine">
            <svg class="btn-svg" viewBox="0 0 24 24" style="stroke: #fff;"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Presets definitions
    const PRESETS = {
      welcome: {
        title: "Welcome Screen",
        icon: '<path d="M5 12h14M12 5l7 7-7 7"/>',
        query: "Welcome Screen",
        isWelcome: true
      },
      revenue: {
        title: "Revenue Table",
        icon: '<path d="M12 3v18M3 12h18"/>',
        query: "Show me a monthly revenue breakdown of Q1 2026",
        response: {
          response_type: "financial-report",
          layout: "TABLE",
          format_reason: "A structured table provides a clear comparison of revenue streams across different months of the first quarter, helping quickly identify financial trends.",
          formatted_answer: "| Month | Software Licensing | Cloud Consulting | Support Contracts | Total |\n|---|---|---|---|---|\n| **January 2026** | $45,200 | $18,900 | $8,500 | $72,600 |\n| **February 2026** | $48,100 | $22,400 | $8,500 | $79,000 |\n| **March 2026** | $52,400 | $25,100 | $9,200 | $86,700 |\n| **Q1 Total** | **$145,700** | **$66,400** | **$26,200** | **$238,300** |"
        }
      },
      architect: {
        title: "Architecture Graph",
        icon: '<path d="M3 12h18M12 3v18"/>',
        query: "Draw a system dependency graph of the Nanosoft Ask-AI agent pipeline",
        response: {
          response_type: "architecture-graph",
          layout: "GRAPH",
          format_reason: "A graph visualization easily explains the sequential and branching flow of user requests processing through our pipeline stages.",
          formatted_answer: JSON.stringify({
            nodes: [
              { id: "A", label: "User Input Panel", type: "input" },
              { id: "B", label: "Understanding Agent", type: "agent" },
              { id: "C", label: "Retrieval & Vector DB", type: "db" },
              { id: "D", label: "Analysis Agent", type: "agent" },
              { id: "E", label: "Response Enveloper", type: "agent" },
              { id: "F", label: "Ask AI UI Renderer", type: "output" }
            ],
            links: [
              { source: "A", target: "B" },
              { source: "B", target: "C" },
              { source: "B", target: "D" },
              { source: "C", target: "D" },
              { source: "D", target: "E" },
              { source: "E", target: "F" }
            ]
          }, null, 2)
        }
      },
      compare: {
        title: "Comparison List",
        icon: '<path d="M3 6h18M3 12h18M3 18h18"/>',
        query: "What are the advantages of using layout wrappers in the Ask-AI engine?",
        response: {
          response_type: "comparison-analysis",
          layout: "BULLET_LIST",
          format_reason: "Bullet points are the cleanest way to summarize distinct advantages without the horizontal space overhead of a table.",
          formatted_answer: "- **Intent-based Layouts**: The backend can format output exactly as the user wants (e.g. lists, graphs, JSON, tables).\n- **Graceful Degradation**: Fallbacks to standard markdown or plain text if formatting parsers run into JSON envelope errors.\n- **Premium Look-and-Feel**: Avoids raw dumps of unformatted text, using glassmorphism and gold-themed containers instead.\n- **Adaptive Querying**: Dynamically converts tables to lists if query context suggests the user doesn't want a table structure."
        }
      },
      rawJson: {
        title: "JSON Output",
        icon: '<path d="M12 21a9 9 0 0 1 0-18M12 3v18"/>',
        query: "Dump the raw JSON configuration metadata",
        response: {
          response_type: "system-config",
          layout: "JSON",
          format_reason: "JSON output is required for system configuration scripts, ensuring easy copy-paste capabilities for developers.",
          formatted_answer: JSON.stringify({
            engine: "Advance-Ask-AI",
            version: "1.2.0-beta",
            llm_provider: "Gemini 3.5 Flash",
            temperature: 0.15,
            routing_rules: [
              { condition: "has_table_keyword", format: "TABLE" },
              { condition: "has_graph_keyword", format: "GRAPH" },
              { condition: "has_code_block", format: "MARKDOWN" }
            ],
            metrics: {
              average_latency_ms: 480,
              token_efficiency_ratio: 0.94
            }
          }, null, 2)
        }
      },
      complaints: {
        title: "AC Complaints",
        icon: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
        query: "How many complaints reported 'AC very noisy' across all residential villas in the Al Jurf locality?"
      },
      standby: {
        title: "Standby Remarks",
        icon: '<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>',
        query: "Are there any standby remarks logged for open tickets that explain delays in execution?"
      }
    };

    let isStreamingActive = false;

    // Load preset
    function loadPreset(key) {
      const preset = PRESETS[key];
      const simulateStream = true;

      if (preset.isWelcome) {
        renderWelcome();
        document.getElementById("query-input").value = "";
      } else if (preset.response) {
        document.getElementById("query-input").value = preset.query;
        if (simulateStream) {
          simulateStreamingResponse(preset.query, preset.response);
        } else {
          renderChatResponse(preset.query, preset.response);
        }
      } else {
        // Send real query to backend
        document.getElementById("query-input").value = preset.query;
        sendQuery();
      }
    }

    // Render Welcome
    function renderWelcome() {
      const wrapper = document.getElementById("content-wrapper");
      wrapper.innerHTML = `
        <div class="landing-card">
          <h1 style="
            font-size: 32px;
            font-family: var(--font-heading);
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #AE8625 0%, #F7EF8A 35%, #D2AC47 65%, #EDC967 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 3s ease-in-out infinite;
          ">
            Welcome to Advance Ask AI
          </h1>
          <p class="landing-subtitle">
            Let's work together buddy
          </p>
          
          <div class="quick-start-grid">
            <div class="quick-card" onclick="loadPreset('complaints')">
              <span class="quick-card-title">
                <svg class="btn-svg" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                AC Complaints
              </span>
              <span class="quick-card-desc">Analyze specific AC noise complaints across residential villas in Al Jurf.</span>
            </div>
            <div class="quick-card" onclick="loadPreset('standby')">
              <span class="quick-card-title">
                <svg class="btn-svg" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Standby Remarks
              </span>
              <span class="quick-card-desc">Investigate standby remarks for open tickets causing execution delays.</span>
            </div>
          </div>
        </div>
      `;
    }

    // Utility to escape HTML and prevent XSS or parsing errors
    function escapeHtml(unsafe) {
        return (unsafe || "").toString()
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
    }

    function normalizeThinkingValue(value) {
      if (value === null || value === undefined || value === "") {
        return "";
      }

      if (Array.isArray(value)) {
        return value.map(normalizeThinkingValue).filter(Boolean).join(", ");
      }

      if (typeof value === "object") {
        return Object.entries(value)
          .map(([key, val]) => `${key}: ${normalizeThinkingValue(val)}`)
          .join(" | ");
      }

      return String(value);
    }

    function appendThinkingContext(contentDiv, stageLabel, thinkingContext, fallbackDetail) {
      if (!contentDiv) return;

      const agentName = thinkingContext?.agent || stageLabel || "Agent";
      const summary = thinkingContext?.summary || fallbackDetail || `${agentName} processing...`;
      const details = Array.isArray(thinkingContext?.details) ? thinkingContext.details : [];

      const block = document.createElement("div");
      block.className = "thinking-agent-block thinking-step-item";

      const title = document.createElement("div");
      title.className = "thinking-agent-title";
      title.innerHTML = `
        <svg class="btn-svg" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6v6l4 2"/></svg>
        <span>${escapeHtml(agentName)}</span>
      `;
      block.appendChild(title);

      const summaryDiv = document.createElement("div");
      summaryDiv.className = "thinking-agent-summary";
      summaryDiv.textContent = summary;
      block.appendChild(summaryDiv);

      if (details.length > 0) {
        const detailList = document.createElement("div");
        detailList.className = "thinking-detail-list";

        details.forEach((item) => {
          const row = document.createElement("div");
          row.className = "thinking-detail-item";

          const label = document.createElement("span");
          label.className = "thinking-detail-label";
          label.textContent = `${item.label}:`;

          const value = document.createElement("span");
          value.className = "thinking-detail-value";
          value.textContent = normalizeThinkingValue(item.value);

          row.appendChild(label);
          row.appendChild(value);
          detailList.appendChild(row);
        });

        block.appendChild(detailList);
      }

      const fullThought = thinkingContext?.full_thought;
      if (fullThought && fullThought !== summary) {
        const detailList = document.createElement("div");
        detailList.className = "thinking-detail-list";

        const row = document.createElement("div");
        row.className = "thinking-detail-item";
        row.style.flexDirection = "column";
        row.style.alignItems = "flex-start";
        row.style.gap = "4px";
        
        row.innerHTML = `
          <span class="thinking-detail-label">Full Thought:</span>
          <span class="thinking-detail-value" style="white-space: pre-wrap; margin-left: 0; margin-top: 4px;">${escapeHtml(fullThought)}</span>
        `;
        detailList.appendChild(row);
        block.appendChild(detailList);
      } else if (fallbackDetail && fallbackDetail !== summary) {
        const detailList = document.createElement("div");
        detailList.className = "thinking-detail-list";

    // Table to bullets converter logic
    function convertTableToBullets(text) {
      const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
      const tableLines = lines.filter(l => l.includes("|"));
      
      if (tableLines.length < 3) {
        return text;
      }

      const parseRow = (rowStr) => {
        let cells = rowStr.split("|").map(c => c.trim());
        if (rowStr.startsWith("|")) cells.shift();
        if (rowStr.endsWith("|")) cells.pop();
        return cells;
      };

      const headers = parseRow(tableLines[0]);
      const rows = [];
      
      for (let i = 2; i < tableLines.length; i++) {
        const cells = parseRow(tableLines[i]);
        const rowParts = [];
        for (let j = 0; j < headers.length; j++) {
          const h = headers[j];
          const c = cells[j] || "";
          if (h && c) {
            rowParts.push(`**${h}**: ${c}`);
          }
        }
        if (rowParts.length > 0) {
          rows.push(`* ${rowParts.join(", ")}`);
        }
      }

      const firstIdx = lines.indexOf(tableLines[0]);
      const lastIdx = lines.indexOf(tableLines[tableLines.length - 1]);
      
      const nonTableBefore = lines.slice(0, firstIdx);
      const nonTableAfter = lines.slice(lastIdx + 1);

      const result = [];
      if (nonTableBefore.length > 0) {
        result.push(nonTableBefore.join("\n"));
      }
      result.push(rows.join("\n"));
      if (nonTableAfter.length > 0) {
        result.push(nonTableAfter.join("\n"));
      }

      return result.join("\n");
    }

    // Custom layout renderers
    function renderTableLayout(text, isDark) {
      let headers = [];
      let rows = [];

      try {
        const obj = JSON.parse(text);
        let data = obj;
        
        // Find the array inside the tool output
        if (!Array.isArray(data)) {
          if (obj.records) data = obj.records;
          else if (obj.sorted_data) data = obj.sorted_data;
          else if (obj.unique_values) data = obj.unique_values;
          else if (obj.groups) data = obj.groups;
        }

        if (Array.isArray(data) && data.length > 0) {
          const flatData = data.flat(Infinity);
          if (flatData.length > 0 && typeof flatData[0] === "object" && flatData[0] !== null) {
            headers = Object.keys(flatData[0]);
            rows = flatData.map(item => headers.map(h => (item[h] !== undefined && item[h] !== null) ? String(item[h]) : ""));
          } else {
             return renderMarkdownLayout(text);
          }
        } else {
          return renderMarkdownLayout(text);
        }
      } catch (e) {
        // Fallback to Markdown parsing
        const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
        const tableLines = lines.filter(l => l.includes("|"));
        if (tableLines.length < 2) return renderMarkdownLayout(text);

        const parseRow = (rowStr) => {
          let cells = rowStr.split("|").map(c => c.trim());
          if (rowStr.startsWith("|")) cells.shift();
          if (rowStr.endsWith("|")) cells.pop();
          return cells;
        };

        headers = parseRow(tableLines[0]);
        rows = tableLines.slice(2).map(parseRow);
      }

      let tableRowsHtml = rows.map((row, rIdx) => {
        let cellsHtml = row.map((cell, cIdx) => {
          let cellContent = cell;
          if (cell.startsWith("**") && cell.endsWith("**")) {

            ${cellsHtml}
          </tr>
        `;
      }).join("");

      return `
        <div style="
          overflow-x: auto;

                border-bottom: 1.5px solid ${isDark ? "rgba(255,255,255,0.12)" : "1.5px solid rgba(15,23,42,0.12)"};
              ">
                ${headers.map(h => `<th style="padding: 10px 14px; fontWeight: 600; color: ${isDark ? "#ffd700" : "#8a6508"}; white-space: nowrap;">${h}</th>`).join("")}
              </tr>

              ${tableRowsHtml}

        </div>
      `;
    }

    function renderListLayout(text, isNumbered, isDark) {
      let parsedItems = [];
      let itemsAreHtml = false;  // true when items are pre-built HTML (from JSON objects)

      try {
        const obj = JSON.parse(text);
        let data = obj;
        if (!Array.isArray(data)) {
          if (obj.records) data = obj.records;
          else if (obj.sorted_data) data = obj.sorted_data;
          else if (obj.unique_values) data = obj.unique_values;
          else if (obj.groups) data = obj.groups;
        }
        
        if (Array.isArray(data) && data.length > 0) {
          const flatData = data.flat(Infinity);
          itemsAreHtml = true;
          parsedItems = flatData
            .map(item => {
              if (typeof item === "object" && item !== null) {
                const filtered = Object.entries(item).filter(([key, value]) => {
                  const v = (value === null || value === undefined) ? "" : String(value).trim();
                  return v !== "" && v !== "null" && v !== "undefined";
                });
                if (filtered.length === 0) return null;
                return filtered
                  .map(([key, value]) => `<span style="opacity:0.75; font-size:12px;">${escapeHtml(key)}:</span> <b>${escapeHtml(String(value))}</b>`)
                  .join(" <span style='opacity:0.3; margin:0 4px;'>|</span> ");
              }
              const strVal = String(item).trim();
              if (strVal === "" || strVal === "null") return null;
              return escapeHtml(strVal);
            })
            .filter(item => item !== null);
        } else {
          throw new Error("Not an array");
        }
      } catch (e) {
        // Fallback to Markdown regex parsing
        const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
        
        for (const line of lines) {
          if (/^([\s]*(?:[-*•]|\d+[.)]))\s*/.test(line)) {
            const clean = line.replace(/^([\s]*(?:[-*•]|\d+[.)]))\s*/, "");
            parsedItems.push(clean);
          } else {
            if (parsedItems.length > 0) {
              parsedItems[parsedItems.length - 1] += "\n" + line;
            } else {
              parsedItems.push(line);
            }
          }
        }
      }

    function renderGraphLayout(text, isDark) {
      // Parse grouped data: [{group_field: name, count/value: N}, ...]
      let data = [];

        const obj = JSON.parse(text);

        }

      const valueKey    = keys.find(k => k === "count" || k === "value") || keys[keys.length - 1];
      const labelKey    = keys.find(k => k !== valueKey) || keys[0];

      const values      = data.map(d => Number(d[valueKey]) || 0);
      const maxVal      = Math.max(...values, 1);
      const barColor    = isDark ? "#D4AF37" : "#AA7C11";

      const bgBar       = isDark ? "rgba(255,255,255,0.04)" : "rgba(0,0,0,0.04)";

      const barsHtml = data.map((item, idx) => {
        const label   = String(item[labelKey] ?? "");
        const val     = Number(item[valueKey]) || 0;
        const pct     = Math.max((val / maxVal) * 100, 0).toFixed(1);
        return `
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
            <div style="
              width:130px;
              flex-shrink:0;
              font-size:12px;
              color:${labelColor};
              text-align:right;
              overflow:hidden;
              text-overflow:ellipsis;
              white-space:nowrap;
              title='${escapeHtml(label)}';
            ">${escapeHtml(label)}</div>
            <div style="flex:1; background:${bgBar}; border-radius:4px; height:22px; position:relative; overflow:hidden;">
              <div style="
                width:${pct}%;
                height:100%;
                background:linear-gradient(90deg, ${barColor} 0%, ${isDark ? '#AA7C11' : '#D4AF37'} 100%);
                border-radius:4px;
                transition: width 0.4s ease;
                min-width:2px;
              "></div>
            </div>
            <div style="
              width:48px;
              flex-shrink:0;
              font-size:12px;
              font-weight:600;
              color:${textColor};
              text-align:left;
            ">${val.toLocaleString()}</div>
          </div>
        `;
      }).join("");

      return `
        <div style="padding:4px 0;">
          <div style="
            font-size:11px;
            color:${labelColor};
            text-transform:uppercase;
            letter-spacing:0.05em;
            margin-bottom:12px;
            display:flex;
            justify-content:space-between;
          ">
            <span>${escapeHtml(labelKey)}</span>
            <span>${escapeHtml(valueKey)}</span>
          </div>
          ${barsHtml}
          <div style="
            margin-top:10px;
            font-size:11px;
            color:${labelColor};
            text-align:right;
          ">${data.length} group${data.length !== 1 ? 's' : ''}</div>
        </div>
      `;
    }

    function renderMarkdownLayout(text) {
      // If the text is raw JSON, render it nicely instead of raw text
      try {
        const obj = JSON.parse(text);
        if (typeof obj === "object" && obj !== null) {
          if (!Array.isArray(obj) && Object.keys(obj).length === 1) {
            // E.g. {"count": 1} -> "count: 1"
            const key = Object.keys(obj)[0];
            return `<div style="font-weight: 600; color: #ffd700; font-size: 16px;">${key}: ${obj[key]}</div>`;
          }
          return renderJsonLayout(text, document.documentElement.classList.contains("dark"));
        } else if (typeof obj === "number" || typeof obj === "string") {
            return `<div style="font-weight: 600; color: #ffd700; font-size: 16px;">${obj}</div>`;
        }
      } catch (e) {
        // Not JSON, continue with Markdown
      }

      return `
        <div style="width: 100%; word-break: break-word; line-height: 1.6;">
          ${parseMarkdownBlocks(text)}
        </div>
      `;
    }

    // Helper regex-based markdown parser
    function parseMarkdownBlocks(text) {
      if (!text) return "";
      const blocks = text.split(/(```[\s\S]*?```)/g);

      return blocks.map(block => {
        if (block.startsWith("```") && block.endsWith("```")) {
          const content = block.slice(3, -3);
          const lines = content.split("\n");
          let lang = "";
          let code = content;
          if (lines.length > 0 && lines[0].trim() && lines[0].trim().length < 15) {
            lang = lines[0].trim();
            code = lines.slice(1).join("\n");
          }
          return `
            <div style="
              background: rgba(0,0,0,0.2);
              padding: 10px 14px;
              border-radius: 6px;
              margin: 8px 0;
              font-family: var(--font-mono);
              font-size: 12px;
              border-left: 3px solid #D4AF37;
              overflow-x: auto;
              color: #cbd5e1;
            ">
              ${lang ? `<div style="font-size: 10px; color: #ffd700; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">${lang}</div>` : ""}
              <pre style="margin: 0; white-space: pre-wrap;">${escapeHtml(code)}</pre>
            </div>
          `;
        }

        const lines = block.split("\n");
        return lines.map((line, lIdx) => {
          const trimmed = line.trim();
          
          if (trimmed.startsWith("### ")) {
            return `<h5 style="margin: 12px 0 6px 0; font-weight: 600; font-size: 14px; border-left: 3.5px solid #D4AF37; padding-left: 8px; color: #D4AF37;">${parseMarkdownTokens(trimmed.slice(4))}</h5>`;
          }
          if (trimmed.startsWith("## ")) {
            return `<h4 style="margin: 16px 0 8px 0; font-weight: 700; font-size: 15px; border-left: 4px solid #D4AF37; padding-left: 8px; color: #D4AF37;">${parseMarkdownTokens(trimmed.slice(3))}</h4>`;
          }
          if (trimmed.startsWith("# ")) {
            return `<h3 style="margin: 20px 0 10px 0; font-weight: 700; font-size: 16px; border-left: 5px solid #D4AF37; padding-left: 8px; color: #D4AF37;">${parseMarkdownTokens(trimmed.slice(2))}</h3>`;
          }

          // Bullet items
          if (/^[-*•]\s+/.test(trimmed)) {
            return `<div style="display: flex; align-items: flex-start; gap: 8px; margin: 4px 0 4px 12px;"><span style="color: #D4AF37; font-size: 12px; margin-top: 2px;">•</span><span style="flex: 1;">${parseMarkdownTokens(trimmed.replace(/^[-*•]\s+/, ""))}</span></div>`;
          }

          // Numbered items
          if (/^\d+[.)]\s+/.test(trimmed)) {
            const match = trimmed.match(/^(\d+)[.)]\s+/);
            const num = match ? match[1] : "1";
            return `<div style="display: flex; align-items: flex-start; gap: 8px; margin: 4px 0 4px 12px;"><span style="color: #D4AF37; font-weight: 600; font-size: 12px; margin-top: 2px;">${num}.</span><span style="flex: 1;">${parseMarkdownTokens(trimmed.replace(/^\d+[.)]\s+/, ""))}</span></div>`;
          }

          return `<span>${parseMarkdownTokens(line)}${lIdx < lines.length - 1 ? "<br />" : ""}</span>`;
        }).join("");
      }).join("");
    }

    function parseMarkdownTokens(text) {
      // Lazy senior dev: strip LaTeX math artifacts instead of adding a heavy math rendering dependency
      text = text.replace(/\$\$/g, '').replace(/\\text\{([^}]+)\}/g, '$1');
      
      const parts = text.split(/(\*\*.*?\*\*|`.*?`)/g);
      return parts.map(part => {
        if (part.startsWith("**") && part.endsWith("**")) {
          return `<strong style="font-weight: 600;">${part.slice(2, -2)}</strong>`;
        }
        if (part.startsWith("`") && part.endsWith("`")) {
          return `<code style="font-family: var(--font-mono); background: rgba(212, 175, 55, 0.12); color: #ffd700; padding: 2px 5px; border-radius: 4px; font-size: 90%; margin: 0 2px; border: 1px solid rgba(212, 175, 55, 0.2);">${part.slice(1, -1)}</code>`;
        }
        return escapeHtml(part);
      }).join("");
    }

    // Send query simulator
      // Send query handler - Updated to match backend "running" status
        // Send query handler - Premium Thinking Bubble with Fade Animation
    async function sendQuery() {
      const input = document.getElementById("query-input");
      const text = input.value.trim();
      if (!text) return;

      // Immediately update UI
      input.value = "";
      const wrapper = document.getElementById("content-wrapper");
      
      // Clear welcome screen if present
      if (wrapper.querySelector(".landing-card")) {
        wrapper.innerHTML = "";
      }

      // Render user message immediately
      const userDiv = document.createElement("div");
      userDiv.className = "message-user";
      userDiv.textContent = text;
      wrapper.appendChild(userDiv);

      // Render temporary loading AI message
      const loadingDiv = document.createElement("div");
      loadingDiv.className = "message-ai";
      loadingDiv.id = "loading-message-ai";
      loadingDiv.innerHTML = `
        <div style="display: flex; flex-direction: column; padding: 0; background: transparent; width: 100%;">
          <button onclick="toggleThinking(this)" style="display: flex; align-items: center; gap: 8px; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.2); border-radius: 8px; padding: 8px 12px; cursor: pointer; color: #D4AF37; font-family: inherit; font-size: 13px; text-align: left; outline: none; width: fit-content; transition: background 0.2s;">
            <!-- Claude-like Thinking Icon -->
            <svg class="thinking-icon" viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; animation: spin 2s linear infinite;">
              <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
            </svg>
            <span id="loading-agent-text" style="font-weight: 500; letter-spacing: 0.3px;">Thinking...</span>
          </button>
          <div id="loading-agent-steps" style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px; padding-left: 12px; border-left: 2px solid rgba(212,175,55,0.2); margin-left: 12px;">
          </div>
        </div>
      `;
      wrapper.appendChild(loadingDiv);
      wrapper.parentElement.scrollTop = wrapper.parentElement.scrollHeight;

      try {
        const res = await fetch("http://localhost:8000/api/query_stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text })
        });
        
        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let done = false;
        let buffer = "";
        let currentStage = "";
        
        while (!done) {
          const { value, done: readerDone } = await reader.read();
          done = readerDone;
          if (value) {
            buffer += decoder.decode(value, { stream: true });
            let newlineIdx;
            while ((newlineIdx = buffer.indexOf('\n')) >= 0) {
              const line = buffer.slice(0, newlineIdx).trim();
              buffer = buffer.slice(newlineIdx + 1);
              if (!line) continue;
              
              try {
                const data = JSON.parse(line);
                
                // Handle backend-driven streaming events
                if (data.status === "running_start") {
                    currentStage = data.stage;
                    const stepsContainer = document.getElementById("loading-agent-steps");
                    if (stepsContainer) {
                        // Hide the "Thinking..." button
                        const btn = stepsContainer.previousElementSibling;
                        if (btn && btn.tagName === 'BUTTON') btn.style.display = 'none';
                        
                        // Clear old agent container or fade it out
                        const oldChild = stepsContainer.firstElementChild;
                        if (oldChild) oldChild.remove();
                        
                        const stepDiv = document.createElement("div");
                        stepDiv.style.transition = "opacity 0.3s ease";
                        stepDiv.style.opacity = '1';
                        stepDiv.style.display = 'flex';
                        stepDiv.style.flexDirection = 'column';
                        
                        const streamContainer = document.createElement("div");
                        streamContainer.id = "active-stream-container";
                        streamContainer.dataset.wordCount = "0";
                        streamContainer.style.background = "rgba(0,0,0,0.2)";
                        streamContainer.style.border = "1px solid rgba(212,175,55,0.15)";
                        streamContainer.style.borderRadius = "6px";
                        streamContainer.style.padding = "10px 12px";
                        streamContainer.style.marginTop = "4px";
                        streamContainer.style.display = "flex";
                        streamContainer.style.flexDirection = "column";
                        
                        const currentLine = document.createElement("span");
                        currentLine.className = "active-stream-line";
                        currentLine.style.fontFamily = "var(--font-mono)";
                        currentLine.style.fontSize = "12px";
                        currentLine.style.color = "#94a3b8";
                        currentLine.style.lineHeight = "1.6";
                        currentLine.style.whiteSpace = "pre-wrap";
                        currentLine.style.transition = "all 1s ease-in-out";
                        
                        streamContainer.appendChild(currentLine);
                        stepDiv.appendChild(streamContainer);
                        stepsContainer.appendChild(stepDiv);
                    }
                }
                else if (data.status === "running_chunk") {
                    const streamContainer = document.getElementById("active-stream-container");
                    if (streamContainer) {
                        let activeLine = streamContainer.querySelector(".active-stream-line:last-child");
                        if (!activeLine) return;
                        
                        let wc = parseInt(streamContainer.dataset.wordCount || "0");
                        
                        // If sentence ends or line is long, create new line and fade old ones
                        if (wc >= 15 || (data.word.trim().match(/[.!?]$/) && wc > 5)) {
                            const newLine = document.createElement("span");
                            newLine.className = "active-stream-line";
                            newLine.style.fontFamily = "var(--font-mono)";
                            newLine.style.fontSize = "12px";
                            newLine.style.color = "#94a3b8";
                            newLine.style.lineHeight = "1.6";
                            newLine.style.whiteSpace = "pre-wrap";
                            newLine.style.transition = "all 1s ease-in-out";
                            streamContainer.appendChild(newLine);
                            
                            // Fade older lines
                            const lines = streamContainer.querySelectorAll(".active-stream-line");
                            const totalLines = lines.length;
                            lines.forEach((line, i) => {
                                let age = totalLines - 1 - i;
                                if (age === 0) {
                                    line.style.opacity = "1";
                                } else if (age === 1) {
                                    line.style.opacity = "0.5";
                                } else {
                                    line.style.opacity = "0";
                                    line.style.maxHeight = "0px";
                                    line.style.margin = "0px";
                                    line.style.padding = "0px";
                                    line.style.overflow = "hidden";
                                }
                            });
                            
                            activeLine = newLine;
                            wc = 0;
                        }
                        
                        const wordSpan = document.createElement("span");
                        wordSpan.textContent = data.word;
                        wordSpan.style.opacity = "0";
                        wordSpan.style.transition = "opacity 0.15s ease-in";
                        activeLine.appendChild(wordSpan);
                        
                        // Trigger reflow
                        void wordSpan.offsetWidth;
                        wordSpan.style.opacity = "1";
                        
                        streamContainer.dataset.wordCount = (wc + 1).toString();
                        
                        const wrapper = document.getElementById("content-wrapper");
                        wrapper.parentElement.scrollTop = wrapper.parentElement.scrollHeight;
                    }
                }
                else if (data.status === "running_end") {
                    // Stream finished for this agent
                }
                else if (data.status === "running") {
                    // Fallback if full thought is sent directly
                } 
                else if (data.status === "complete") {
                    // Smoothly remove loading bubble before showing answer
                    const tb = document.getElementById("loading-message-ai");
                    if (tb) {
                        tb.style.transition = "opacity 0.3s ease, transform 0.3s ease";
                        tb.style.opacity = "0";
                        tb.style.transform = "translateY(-8px)";
                        setTimeout(() => tb.remove(), 300);
                    } 

                    // Render final response
                    renderChatResponse(text, data.result);
                }
              } catch(e) {
                console.error("Parse error on stream chunk line:", line, e);
              }
            }
          }
        }
      } catch (e) {
        console.error(e);
        const tb = document.getElementById("thinking-bubble");
        if (tb) tb.remove();

        const errorObj = {
          response_type: "error",
          layout: "PLAIN_TEXT",
          format_reason: "Connection failed",
          formatted_answer: "Failed to connect to backend API. Please make sure test_pipeline.py is running with --api flag."
        };
        renderChatResponse(text, errorObj);
      }
    }
    // Init with Welcome screen
    renderWelcome();
  </script>
